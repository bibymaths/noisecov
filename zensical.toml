[project]
site_name = "noisecov"
site_description = "Noise-aware latent covariance estimation"
site_url = "https://OWNER.github.io/noisecov/"
repo_url = "https://github.com/OWNER/noisecov"
docs_dir = "docs"
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Statistical Model" = "statistical-model.md" },
  { "Corrected Covariance" = "corrected-covariance.md" },
  { "Maximum Likelihood" = "maximum-likelihood.md" },
  { "Factor Model" = "factor-model.md" },
  { "Correlation" = "correlation.md" },
  { "Single-cell / AnnData" = "single-cell.md" },
  { "Choosing a Method" = "choosing-a-method.md" },
  { "Simulations" = "simulations.md" },
  { "API Reference" = "api.md" },
  { "Scaling" = "scaling.md" },
  { "Assumptions and Limitations" = "limitations.md" },
  { "Existing Tools" = "existing-tools.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]

[project.markdown_extensions]
pymdownx.arithmatex.generic = true
