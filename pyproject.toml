[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noisecov"
version = "0.1.0"
description = "Latent covariance estimation with known heteroscedastic measurement uncertainty"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
authors = [{ name = "Abhinav Mishra" }]
keywords = [
  "covariance",
  "measurement-error",
  "heteroscedasticity",
  "factor-analysis",
  "single-cell",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "typer>=0.12",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
scvi = ["anndata>=0.10", "scvi-tools>=1.3"]

[project.scripts]
noisecov = "noisecov.cli:app"

[project.urls]
Documentation = "https://OWNER.github.io/noisecov"
Repository = "https://github.com/OWNER/noisecov"
Issues = "https://github.com/OWNER/noisecov/issues"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "ruff>=0.9",
]
test = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]
docs = ["zensical>=0.0.20"]
notebooks = [
  "anndata>=0.10",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pandas>=2.2",
  "scanpy>=1.10",
]
singlecell = ["anndata>=0.10", "scanpy>=1.10"]
benchmarks = ["psutil>=6.1", "pytest-benchmark>=5.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/noisecov"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=noisecov --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:.*L-BFGS-B.*disp.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
  "src/noisecov/anndata.py",
  "src/noisecov/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "pragma: no cover",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["noisecov"]

[[tool.mypy.overrides]]
module = ["scipy.*", "anndata.*"]
ignore_missing_imports = true
